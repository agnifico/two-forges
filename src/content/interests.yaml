# The "Interests and hobbies" bubbles, in the order they show. Each links to the stations it lives
# in (station ids from config.ts, on either side of the island). One station: the bubble opens it.
# Several: the camera frames them all and the blurb shows with a link to each.
# Every station should appear in at least one interest, so keyboard visitors can reach it.

- id: about
  label: About Me
  stations: [cottage]
  blurb: Where I live when I'm not at the anvil.

- id: making
  label: Forged in Fire - JunesForge
  stations: [furnace]
  blurb: Everything here starts in the fire.

- id: art
  label: Art and Expression
  stations: [easels, paintVats]
  blurb: Drawing, painting, and the colours I keep coming back to.

- id: architecture
  label: Space and Design
  stations: [draftingDesk]
  blurb: Buildings I'd like to see stand.

- id: maps
  label: World Building
  stations: [mapTable]
  blurb: Places that exist, and some that don't yet.

- id: gaming
  label: Once, a gamer...
  stations: [arcade]
  blurb: The games that made me.

- id: reading
  label: Books and Trivia
  stations: [readingCorner]
  blurb: What I read, and the odd facts that stay with me.

- id: engineering
  label: ...always a student.
  stations: [waterwheel]
  blurb: Taking things apart until only the atoms are left.

- id: world
  label: Worldview
  stations: [keep, seventhFloor, hero]
  blurb: The beliefs I defend, and the fights I pick for them.

- id: fighting
  label: Strategist-class Gladiator
  stations: [arena, arenaTree]
  blurb: The beliefs I defend, and the fights I pick for them.

- id: memory
  label: The Ashes
  stations: [graveyard]
  blurb: The people and moments I carry with me.

- id: commons
  label: The Commons
  stations: [market]
  blurb: The people and the trade around the castle.
