<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Self-hosted fonts (OFL; see CREDITS.md): Chakra Petch for the interface. Literata stands in for
		     the serif (titles and text) where Iowan Old Style isn't installed (it only loads there). -->
		<link rel="preload" href="%sveltekit.assets%/fonts/chakra-petch-500.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			@font-face {
				font-family: 'Chakra Petch';
				src: url('%sveltekit.assets%/fonts/chakra-petch-400.woff2') format('woff2');
				font-weight: 400;
				font-display: swap;
			}
			@font-face {
				font-family: 'Chakra Petch';
				src: url('%sveltekit.assets%/fonts/chakra-petch-500.woff2') format('woff2');
				font-weight: 500;
				font-display: swap;
			}
			@font-face {
				font-family: 'Chakra Petch';
				src: url('%sveltekit.assets%/fonts/chakra-petch-600.woff2') format('woff2');
				font-weight: 600;
				font-display: swap;
			}
			@font-face {
				font-family: 'Literata';
				src: url('%sveltekit.assets%/fonts/literata.woff2') format('woff2');
				font-weight: 400 700;
				font-display: swap;
			}
			@font-face {
				font-family: 'Literata';
				src: url('%sveltekit.assets%/fonts/literata-italic.woff2') format('woff2');
				font-style: italic;
				font-weight: 400 700;
				font-display: swap;
			}
		</style>
		<!-- At night the page is built in day colours and only turns dark once the script runs. Until then,
		     show plain night sky instead of a flash of cream. Same rule as isNight() in daylight.ts.
		     The layout removes the class once it's up. -->
		<script>
			(function () {
				var time = new URLSearchParams(location.search).get('time');
				var hour = time !== null && isFinite(Number(time)) ? Number(time) : new Date().getHours();
				var night = time === 'night' || (time !== 'day' && (hour >= 19 || hour < 6));
				if (night) document.documentElement.classList.add('night');
			})();
		</script>
		<style>
			html.night {
				background: #2b2850;
			}
			html.night body {
				visibility: hidden;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
