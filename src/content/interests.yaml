# The "Interests and hobbies" bubbles, in the order they show. Each links to the stations it lives
# in (station ids from config.ts, on either side of the island). One station: the bubble opens it.
# Several: the camera frames them all and a card shows the blurb with a link to each. So a blurb
# is only needed (and only shown) when an interest has several stations.
# Every station should appear in at least one interest, so keyboard visitors can reach it.

- id: about
  label: About Me
  stations: [cottage]

- id: making
  label: JunesForge
  stations: [furnace]
  blurb: Everything here starts in the fire.

- id: techstack
  label: Tech/Stack
  stations: [workbench]
  blurb: Everything here starts in the fire.

- id: art
  label: Art/Expression
  stations: [easels, paintVats, draftingDesk, mapTable, readingCorner]
  blurb: The creative side - one I refused to choose but chose me instead.

- id: gaming
  label: Gaming
  stations: [arcade, vendingMachine]
  blurb: The games that made me.

- id: engineering
  label: Engineering
  stations: [waterwheel]

- id: world
  label: Worldview
  stations: [keep, seventhFloor, hero]
  blurb: The beliefs I defend, and the fights I pick for them.

- id: fighting
  label: Strategist-class Gladiator
  stations: [arena, arenaTree]
  blurb: The beliefs I defend, and the fights I pick for them.

- id: memory
  label: The Ashes
  stations: [graveyard]

- id: commons
  label: The Commons
  stations: [market]
